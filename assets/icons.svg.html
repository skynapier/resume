<!-- Reusable SVG assets for the resume.
     Inline these directly into HTML or copy as needed. -->

<!-- Hanko stamp (vermillion square seal w/ JB) -->
<svg class="asset-hanko" width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="40" height="40" rx="3" fill="#b94334"/>
  <text x="22" y="19" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="13" font-weight="700" fill="#fafaf7" letter-spacing="0.5">JB</text>
  <text x="22" y="34" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="10" font-weight="500" fill="#fafaf7" letter-spacing="1">SE</text>
</svg>

<!-- Subtle horizontal rule, two-stop -->
<svg class="asset-rule" width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none">
  <line x1="0" y1="1" x2="100" y2="1" stroke="#181818" stroke-width="1"/>
</svg>

<!-- Section marker (small filled square) -->
<svg class="asset-marker" width="8" height="8" viewBox="0 0 8 8">
  <rect width="8" height="8" fill="#181818"/>
</svg>

<!-- Enso (zen circle) accent — for sumi variation -->
<svg class="asset-enso" width="60" height="60" viewBox="0 0 60 60">
  <path d="M 30 8 A 22 22 0 1 1 18 12.5"
        stroke="#181818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

<!-- Vertical reading rail (for ma variation) -->
<svg class="asset-rail" width="2" height="100%" viewBox="0 0 2 100" preserveAspectRatio="none">
  <line x1="1" y1="0" x2="1" y2="100" stroke="#d8d6cf" stroke-width="1"/>
</svg>

<!-- Github / Web glyph (mono line) -->
<svg class="asset-link" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
  <path d="M5 7 L7 5 M3 9 L1.5 7.5 a2 2 0 0 1 0-3 L3 3 M9 3 L10.5 4.5 a2 2 0 0 1 0 3 L9 9"/>
</svg>
